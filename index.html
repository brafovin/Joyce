<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Spiel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            color: white;
            transition: background 1.2s ease;
        }

        /* Level-abhängige Hintergrundfarben */
        body.level-1 { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #3b82f6 100%); }
        body.level-2 { background: linear-gradient(135deg, #0f766e 0%, #14b8a6 50%, #2dd4bf 100%); }
        body.level-3 { background: linear-gradient(135deg, #065f46 0%, #10b981 50%, #6ee7b7 100%); }
        body.level-4 { background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 50%, #a78bfa 100%); }
        body.level-5 { background: linear-gradient(135deg, #9d174d 0%, #db2777 50%, #f472b6 100%); }
        body.level-6 { background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 50%, #f97316 100%); }
        body.level-7 { background: linear-gradient(135deg, #78350f 0%, #d97706 50%, #fcd34d 100%); }
        body.level-8 { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #6366f1 100%); }
        body.level-9 { background: linear-gradient(135deg, #831843 0%, #7c3aed 35%, #dc2626 70%, #f59e0b 100%); }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            letter-spacing: 2px;
        }

        .level-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.4);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .info {
            display: flex;
            gap: 25px;
            margin: 15px 0;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.95);
            color: #1e3c72;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.35);
        }

        button:active {
            transform: translateY(0);
        }

        .game-board {
            display: grid;
            gap: 12px;
            max-width: 650px;
            width: 100%;
        }

        .game-board.cards-8 { grid-template-columns: repeat(4, 1fr); }
        .game-board.cards-12 { grid-template-columns: repeat(4, 1fr); }
        .game-board.cards-16 { grid-template-columns: repeat(4, 1fr); }
        .game-board.cards-20 { grid-template-columns: repeat(5, 1fr); }
        .game-board.cards-24 { grid-template-columns: repeat(6, 1fr); }
        .game-board.cards-28 { grid-template-columns: repeat(7, 1fr); max-width: 750px; }
        .game-board.cards-32 { grid-template-columns: repeat(8, 1fr); max-width: 800px; }
        .game-board.cards-36 { grid-template-columns: repeat(6, 1fr); max-width: 750px; }
        .game-board.cards-40 { grid-template-columns: repeat(8, 1fr); max-width: 850px; }

        .card {
            aspect-ratio: 3 / 4;
            position: relative;
            cursor: pointer;
        }

        .card.matched {
            cursor: default;
        }

        .card.matched .card-front {
            background: linear-gradient(135deg, #a8e063, #56ab2f);
        }

        .card-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            font-size: clamp(1.8rem, 7vw, 4rem);
            overflow: hidden;
        }

        .card-front {
            visibility: hidden;
        }

        .card.flipped .card-front,
        .card.matched .card-front {
            visibility: visible;
        }

        .card.flipped .card-back,
        .card.matched .card-back {
            visibility: hidden;
        }

        .game-board.cards-28 .card-face,
        .game-board.cards-32 .card-face,
        .game-board.cards-36 .card-face,
        .game-board.cards-40 .card-face {
            font-size: clamp(1.3rem, 4.5vw, 2.4rem);
        }

        .game-board.cards-28,
        .game-board.cards-32,
        .game-board.cards-36,
        .game-board.cards-40 {
            gap: 8px;
        }

        .card-back {
            background-color: #ff5e62;
            background-image:
                repeating-linear-gradient(45deg,
                    rgba(255,255,255,0.18) 0 6px,
                    transparent 6px 14px),
                repeating-linear-gradient(-45deg,
                    rgba(0,0,0,0.12) 0 6px,
                    transparent 6px 14px),
                linear-gradient(135deg, #ff9966, #ff5e62);
            color: white;
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            border: 3px solid #fff;
            position: relative;
        }

        .game-board.cards-28 .card-back,
        .game-board.cards-32 .card-back,
        .game-board.cards-36 .card-back,
        .game-board.cards-40 .card-back {
            font-size: clamp(0.9rem, 2.8vw, 1.6rem);
        }

        .card-back::before {
            content: "?";
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.5), 0 0 8px rgba(255,255,255,0.4);
            background: rgba(255, 94, 98, 0.9);
            width: 58%;
            height: 58%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.2);
        }

        .card-front {
            background: white;
            color: #333;
            border: 3px solid #764ba2;
        }

        .win-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            color: #1e293b;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            z-index: 100;
            border: 4px solid #fbbf24;
            max-width: 90%;
        }

        .win-message.show {
            display: block;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .win-message h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #1e3a8a;
        }

        .win-message p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #334155;
        }

        .win-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-next {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 12px 28px;
            font-size: 1.1rem;
        }

        .btn-replay {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 12px 28px;
        }

        .final-message {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.3rem !important;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.8rem; }
            .card-face { font-size: 1.8rem; }
            .card-back::after { font-size: 1.4rem; }
            .game-board { gap: 8px; }
            .info { font-size: 0.95rem; gap: 15px; padding: 8px 14px; }
        }
    </style>
</head>
<body class="level-1">
    <h1>🎴 Memory Spiel 🎴</h1>
    <div class="level-badge">Level <span id="level">1</span> von <span id="max-level">9</span></div>

    <div class="info">
        <span>Züge: <span id="moves">0</span></span>
        <span>Paare: <span id="pairs">0</span> / <span id="total-pairs">4</span></span>
    </div>

    <div class="controls">
        <button id="btn-restart">Level neu starten</button>
        <button id="btn-reset">Bei Level 1 starten</button>
    </div>

    <div id="board" class="game-board cards-8"></div>

    <div id="win-message" class="win-message">
        <h2 id="win-title">🎉 Level geschafft! 🎉</h2>
        <p id="win-text">Du hast alle Paare in <span id="final-moves">0</span> Zügen gefunden!</p>
        <div class="win-buttons">
            <button id="btn-next" class="btn-next">Nächstes Level →</button>
            <button id="btn-replay" class="btn-replay">Level wiederholen</button>
        </div>
    </div>

    <script>
        const SYMBOLS = [
            '🐶', '🐱', '🦊', '🐻', '🐼', '🦁', '🐸', '🐵', '🦄', '🐙',
            '🦋', '🐧', '🐢', '🦉', '🐝', '🐞', '🦖', '🦒', '🐳', '🦩'
        ];

        // Pro Level: Kartenanzahl (immer gerade, steigt pro Level bis 40)
        const LEVELS = [
            { cards: 8 },   // Level 1
            { cards: 12 },  // Level 2
            { cards: 16 },  // Level 3
            { cards: 20 },  // Level 4
            { cards: 24 },  // Level 5
            { cards: 28 },  // Level 6
            { cards: 32 },  // Level 7
            { cards: 36 },  // Level 8
            { cards: 40 }   // Level 9
        ];

        let currentLevel = 1;
        let cardCount = LEVELS[0].cards;
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let lockBoard = false;

        const body = document.body;
        const board = document.getElementById('board');
        const levelEl = document.getElementById('level');
        const maxLevelEl = document.getElementById('max-level');
        const movesEl = document.getElementById('moves');
        const pairsEl = document.getElementById('pairs');
        const totalPairsEl = document.getElementById('total-pairs');
        const winMessage = document.getElementById('win-message');
        const winTitle = document.getElementById('win-title');
        const winText = document.getElementById('win-text');
        const finalMovesEl = document.getElementById('final-moves');
        const btnRestart = document.getElementById('btn-restart');
        const btnReset = document.getElementById('btn-reset');
        const btnNext = document.getElementById('btn-next');
        const btnReplay = document.getElementById('btn-replay');

        btnRestart.addEventListener('click', startGame);
        btnReset.addEventListener('click', () => {
            currentLevel = 1;
            startGame();
        });
        btnNext.addEventListener('click', () => {
            if (currentLevel < LEVELS.length) {
                currentLevel++;
            }
            startGame();
        });
        btnReplay.addEventListener('click', startGame);

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function updateBackground() {
            body.className = 'level-' + currentLevel;
        }

        function startGame() {
            cardCount = LEVELS[currentLevel - 1].cards;
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            lockBoard = false;

            levelEl.textContent = currentLevel;
            maxLevelEl.textContent = LEVELS.length;
            movesEl.textContent = '0';
            pairsEl.textContent = '0';
            totalPairsEl.textContent = cardCount / 2;
            winMessage.classList.remove('show');

            updateBackground();

            board.className = 'game-board cards-' + cardCount;
            board.innerHTML = '';

            const pairsNeeded = cardCount / 2;
            const selectedSymbols = SYMBOLS.slice(0, pairsNeeded);
            const cards = shuffle([...selectedSymbols, ...selectedSymbols]);

            cards.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.symbol = symbol;
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front"><span>${symbol}</span></div>
                `;
                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (lockBoard) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
            if (flippedCards.length >= 2) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.symbol === card2.dataset.symbol;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                matchedPairs++;
                pairsEl.textContent = matchedPairs;
                flippedCards = [];

                if (matchedPairs === cardCount / 2) {
                    setTimeout(showWin, 700);
                }
            } else {
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }

        function showWin() {
            finalMovesEl.textContent = moves;
            const isFinalLevel = currentLevel >= LEVELS.length;

            if (isFinalLevel) {
                winTitle.innerHTML = '👑 Alle Level geschafft! 👑';
                winText.innerHTML = `<span class="final-message">Du bist ein Memory-Meister!</span><br><br>Letztes Level in <span>${moves}</span> Zügen.`;
                btnNext.style.display = 'none';
            } else {
                winTitle.innerHTML = `🎉 Level ${currentLevel} geschafft! 🎉`;
                winText.innerHTML = `Du hast alle Paare in <span id="final-moves">${moves}</span> Zügen gefunden!<br>Bereit für Level ${currentLevel + 1}?`;
                btnNext.style.display = 'inline-block';
                btnNext.textContent = `Level ${currentLevel + 1} starten →`;
            }

            winMessage.classList.add('show');
        }

        startGame();
    </script>
</body>
</html>
