<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Spiel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .info {
            display: flex;
            gap: 20px;
            margin: 15px 0;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #764ba2;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: #ffd700;
        }

        .game-board {
            display: grid;
            gap: 12px;
            perspective: 1000px;
            max-width: 600px;
            width: 100%;
        }

        .game-board.cards-8 {
            grid-template-columns: repeat(4, 1fr);
        }

        .game-board.cards-12 {
            grid-template-columns: repeat(4, 1fr);
        }

        .card {
            aspect-ratio: 3 / 4;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card.matched .card-front {
            background: linear-gradient(135deg, #a8e063, #56ab2f);
            animation: pulse 0.6s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            font-size: 3rem;
        }

        .card-back {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            color: white;
            font-size: 2.5rem;
            border: 3px solid #fff;
        }

        .card-back::before {
            content: "?";
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card-front {
            background: white;
            color: #333;
            transform: rotateY(180deg);
            border: 3px solid #764ba2;
        }

        .win-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #333;
            padding: 40px 60px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .win-message.show {
            display: block;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .win-message h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #764ba2;
        }

        .win-message p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.8rem; }
            .card-back, .card-front { font-size: 2rem; }
            .game-board { gap: 8px; }
        }
    </style>
</head>
<body>
    <h1>🎴 Memory Spiel 🎴</h1>

    <div class="controls">
        <button id="btn-8" class="active">8 Karten</button>
        <button id="btn-12">12 Karten</button>
        <button id="btn-restart">Neu starten</button>
    </div>

    <div class="info">
        <span>Züge: <span id="moves">0</span></span>
        <span>Paare: <span id="pairs">0</span> / <span id="total-pairs">4</span></span>
    </div>

    <div id="board" class="game-board cards-8"></div>

    <div id="win-message" class="win-message">
        <h2>🎉 Gewonnen! 🎉</h2>
        <p>Du hast alle Paare in <span id="final-moves">0</span> Zügen gefunden!</p>
        <button onclick="startGame()">Nochmal spielen</button>
    </div>

    <script>
        const SYMBOLS = ['🐶', '🐱', '🦊', '🐻', '🐼', '🦁', '🐸', '🐵', '🦄', '🐙', '🦋', '🐧'];

        let cardCount = 8;
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let lockBoard = false;

        const board = document.getElementById('board');
        const movesEl = document.getElementById('moves');
        const pairsEl = document.getElementById('pairs');
        const totalPairsEl = document.getElementById('total-pairs');
        const winMessage = document.getElementById('win-message');
        const finalMovesEl = document.getElementById('final-moves');
        const btn8 = document.getElementById('btn-8');
        const btn12 = document.getElementById('btn-12');
        const btnRestart = document.getElementById('btn-restart');

        btn8.addEventListener('click', () => {
            cardCount = 8;
            btn8.classList.add('active');
            btn12.classList.remove('active');
            startGame();
        });

        btn12.addEventListener('click', () => {
            cardCount = 12;
            btn12.classList.add('active');
            btn8.classList.remove('active');
            startGame();
        });

        btnRestart.addEventListener('click', startGame);

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            lockBoard = false;
            movesEl.textContent = '0';
            pairsEl.textContent = '0';
            totalPairsEl.textContent = cardCount / 2;
            winMessage.classList.remove('show');

            board.className = 'game-board cards-' + cardCount;
            board.innerHTML = '';

            const pairsNeeded = cardCount / 2;
            const selectedSymbols = SYMBOLS.slice(0, pairsNeeded);
            const cards = shuffle([...selectedSymbols, ...selectedSymbols]);

            cards.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.symbol = symbol;
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">${symbol}</div>
                `;
                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (lockBoard) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
            if (flippedCards.length >= 2) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.symbol === card2.dataset.symbol;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                matchedPairs++;
                pairsEl.textContent = matchedPairs;
                flippedCards = [];

                if (matchedPairs === cardCount / 2) {
                    setTimeout(showWin, 600);
                }
            } else {
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }

        function showWin() {
            finalMovesEl.textContent = moves;
            winMessage.classList.add('show');
        }

        startGame();
    </script>
</body>
</html>
